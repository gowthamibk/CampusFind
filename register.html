
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - CampusFind</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Navigation Bar -->

    <nav class="navbar">

        <div class="logo">
            CampusFind
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="items.html">Browse Items</a>

            <a href="report-lost.html">Report Lost</a>

            <a href="report-found.html">Report Found</a>

            <a href="login.html" class="login-btn">
                Login
            </a>

        </div>

    </nav>


    <!-- Create Account -->

    <section class="login-section">

        <div class="login-container">

            <h1>Create Account</h1>

            <p class="login-description">
                Create your CampusFind account
            </p>

            <form id="registerForm">

                <!-- Full Name -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- Create Account Button -->

                <button
                    type="submit"
                    class="submit-btn login-submit"
                >
                    Create Account
                </button>


                <!-- Login Link -->

                <p class="register-text">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </form>

        </div>

    </section>


    <!-- Footer -->

    <footer>

        <h3>
            CampusFind
        </h3>

        <p>
            Smart Campus Lost & Found Management System
        </p>

        <p>
            © 2026 CampusFind. All Rights Reserved.
        </p>

    </footer>


    <!-- JavaScript -->

    <script>

        const registerForm = document.getElementById("registerForm");

        registerForm.addEventListener("submit", function(event) {

            event.preventDefault();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {

                alert("Passwords do not match!");

                return;

            }

            alert("Account created successfully!");

            registerForm.reset();

        });

    </script>

</body>

</html>
