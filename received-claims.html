
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Received Claims | CampusFind</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: #f3f6ff;
        }

        .notification-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            height: 20px;
            padding: 0 5px;
            border-radius: 50px;
            background: #ef4444;
            color: white;
            font-size: 11px;
            font-weight: bold;
            margin-left: 5px;
        }

        .received-container {
            max-width: 1200px;
            margin: 45px auto;
            padding: 0 22px;
        }

        .received-hero {
            padding: 35px;
            border-radius: 22px;
            color: white;
            background: linear-gradient(120deg, #173c91, #4779ed, #8258df);
            box-shadow: 0 12px 30px rgba(55, 85, 180, .2);
            margin-bottom: 30px;
        }

        .received-hero h1 {
            font-size: 32px;
            margin: 0 0 10px;
        }

        .received-hero p {
            margin: 0;
            opacity: .9;
        }

        .claim-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 28px;
        }

        .claim-stat {
            padding: 22px;
            border-radius: 17px;
            background: white;
            box-shadow: 0 5px 20px rgba(25, 45, 100, .07);
            border-left: 5px solid #4779ed;
        }

        .claim-stat:nth-child(2) {
            border-color: #e5a323;
        }

        .claim-stat:nth-child(3) {
            border-color: #20aa78;
        }

        .claim-stat p {
            color: #68748b;
            margin: 0 0 8px;
        }

        .claim-stat h2 {
            font-size: 30px;
            margin: 0;
            color: #182b52;
        }

        .claim-toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .claim-toolbar input,
        .claim-toolbar select {
            padding: 13px 15px;
            border: 1px solid #dce3f2;
            border-radius: 11px;
            background: white;
            font-size: 14px;
        }

        .claim-toolbar input {
            flex: 1;
            min-width: 220px;
        }

        .claim-toolbar select {
            min-width: 170px;
        }

        .received-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
        }

        .received-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 7px 24px rgba(30, 50, 100, .08);
            border: 1px solid #e9edf7;
        }

        .received-card-top {
            padding: 20px;
            display: flex;
            gap: 16px;
            align-items: center;
            background: linear-gradient(120deg, #f1f5ff, #f8f4ff);
        }

        .received-card-top img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 13px;
            background: #e5eaf5;
        }

        .received-card-top h3 {
            margin: 0 0 7px;
            color: #1b2e55;
        }

        .received-card-top p {
            margin: 4px 0;
            color: #68748b;
            font-size: 13px;
        }

        .received-card-body {
            padding: 20px;
        }

        .claim-person {
            font-weight: 700;
            color: #253b68;
            margin-bottom: 8px;
        }

        .claim-message {
            background: #f5f7fc;
            padding: 14px;
            border-radius: 11px;
            color: #53617b;
            line-height: 1.6;
            margin: 13px 0;
            overflow-wrap: anywhere;
        }

        .claim-contact {
            color: #53617b;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .claim-status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            text-transform: capitalize;
        }

        .status-pending {
            background: #fff3d7;
            color: #a66b00;
        }

        .status-approved {
            background: #dff8ed;
            color: #08784e;
        }

        .status-rejected {
            background: #ffe4e6;
            color: #c22c45;
        }

        .claim-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .claim-actions button {
            flex: 1;
            padding: 12px;
            border: 0;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
        }

        .claim-actions button:hover {
            transform: translateY(-2px);
            opacity: .9;
        }

        .approve-btn {
            color: white;
            background: linear-gradient(120deg, #12a875, #20c58b);
        }

        .reject-btn {
            color: white;
            background: linear-gradient(120deg, #e34d63, #fa7181);
        }

        .view-item-btn {
            display: inline-block;
            margin-top: 12px;
            color: #416ce0;
            font-weight: 700;
            text-decoration: none;
        }

        .empty-claims {
            grid-column: 1 / -1;
            background: white;
            padding: 45px 20px;
            border-radius: 18px;
            text-align: center;
            color: #68748b;
        }

        .empty-claims h2 {
            color: #24375d;
        }

        @media(max-width: 750px) {
            .received-grid {
                grid-template-columns: 1fr;
            }

            .claim-stats {
                grid-template-columns: 1fr;
            }

            .received-hero h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Campus<span>Find</span></a>

            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="items.html">Browse Items</a>
                <a href="stats.html">📊 Statistics</a>
                <a href="my-reports.html">My Reports</a>
                <a href="my-claims.html">My Claims</a>
                <a href="received-claims.html">Received Claims</a>
                <a href="notifications.html">
                    Notifications
                    <span id="notificationBadge" class="notification-badge" style="display:none;">0</span>
                </a>
            </nav>

            <button id="logoutButton" class="btn btn-primary">Logout</button>
        </div>
    </header>

    <main class="received-container">

        <section class="received-hero">
            <h1>📩 Received Claims</h1>
            <p>Review requests from people claiming the items you've reported.</p>
        </section>

        <section class="claim-stats">
            <div class="claim-stat">
                <p>Total Claims</p>
                <h2 id="totalClaims">0</h2>
            </div>

            <div class="claim-stat">
                <p>Pending Review</p>
                <h2 id="pendingClaims">0</h2>
            </div>

            <div class="claim-stat">
                <p>Approved Claims</p>
                <h2 id="approvedClaims">0</h2>
            </div>
        </section>

        <div class="claim-toolbar">
            <input
                type="text"
                id="searchInput"
                placeholder="Search by item or claimant..."
            >

            <select id="statusFilter">
                <option value="all">All Claims</option>
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="rejected">Rejected</option>
            </select>
        </div>

        <section class="received-grid" id="claimsContainer">
            <div class="empty-claims">Loading received claims...</div>
        </section>

    </main>

    <script>
        const API = "https://campusfind-cl7z.onrender.com/api/claims";
        const NOTIFICATION_API = "https://campusfind-cl7z.onrender.com/api/notifications";
        const token = localStorage.getItem("token");

        let claims = [];

        if (!token) {
            alert("Please login first.");
            window.location.href = "login.html";
        }

        document.getElementById("logoutButton").addEventListener("click", () => {
            localStorage.removeItem("token");
            localStorage.removeItem("user");
            window.location.href = "login.html";
        });

        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            })[char]);
        }

        function formatDate(value) {
            if (!value) return "Date unavailable";

            const date = new Date(value);

            return Number.isNaN(date.getTime())
                ? "Date unavailable"
                : date.toLocaleDateString("en-IN");
        }

        async function loadNotificationCount() {
            try {
                const response = await fetch(`${NOTIFICATION_API}/unread-count`, {
                    headers: {
                        Authorization: `Bearer ${token}`
                    }
                });

                if (!response.ok) return;

                const data = await response.json();

                const badge = document.getElementById("notificationBadge");
                const count = Number(data.count || data.unreadCount || 0);

                if (count > 0) {
                    badge.textContent = count > 99 ? "99+" : count;
                    badge.style.display = "inline-flex";
                } else {
                    badge.style.display = "none";
                }

            } catch (error) {
                console.error("Notification count error:", error);
            }
        }

        function updateStats() {
            document.getElementById("totalClaims").textContent = claims.length;

            document.getElementById("pendingClaims").textContent =
                claims.filter(c => c.status === "pending").length;

            document.getElementById("approvedClaims").textContent =
                claims.filter(c => c.status === "approved").length;
        }

        function displayClaims() {
            const container = document.getElementById("claimsContainer");
            const search = document.getElementById("searchInput").value.toLowerCase();
            const status = document.getElementById("statusFilter").value;

            const filtered = claims.filter(claim => {
                const itemName = claim.item?.itemName || "";

                // FIX: Backend uses claimedBy, not claimant
                const claimantName = claim.claimedBy?.name || "";
                const claimantEmail = claim.claimedBy?.email || "";

                const matchesSearch =
                    itemName.toLowerCase().includes(search) ||
                    claimantName.toLowerCase().includes(search) ||
                    claimantEmail.toLowerCase().includes(search);

                const matchesStatus =
                    status === "all" || claim.status === status;

                return matchesSearch && matchesStatus;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-claims">
                        <h2>📭 No claims found</h2>
                        <p>There are no claims matching your search or filter.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(claim => {
                const item = claim.item || {};

                // FIX: Backend populates claimedBy
                const claimant = claim.claimedBy || {};

                const image = item.image || "";

                const imageHTML = image
                    ? `<img src="${escapeHTML(image)}" alt="Item image">`
                    : `<img src="https://placehold.co/100x100?text=No+Image" alt="No image">`;

                return `
                    <article class="received-card">
                        <div class="received-card-top">
                            ${imageHTML}
                            <div>
                                <h3>${escapeHTML(item.itemName || "Unknown item")}</h3>
                                <p>📍 ${escapeHTML(item.location || "Location unavailable")}</p>
                                <p>📅 Reported: ${formatDate(item.date)}</p>
                            </div>
                        </div>

                        <div class="received-card-body">
                            <p class="claim-person">
                                👤 ${escapeHTML(claimant.name || "Campus user")}
                            </p>

                            <p class="claim-contact">
                                ✉️ ${escapeHTML(claimant.email || "Email unavailable")}
                            </p>

                            <p class="claim-contact">
                                📞 ${escapeHTML(claim.contact || "Contact unavailable")}
                            </p>

                            <div class="claim-message">
                                <strong>Claim explanation:</strong><br>
                                ${escapeHTML(claim.message || "No message provided")}
                            </div>

                            <p>
                                <span class="claim-status status-${escapeHTML(claim.status)}">
                                    ${escapeHTML(claim.status)}
                                </span>
                                <span style="float:right;color:#8490a5;font-size:12px">
                                    ${formatDate(claim.createdAt)}
                                </span>
                            </p>

                            <a class="view-item-btn"
                               href="item-details.html?id=${encodeURIComponent(item._id || "")}">
                               View Item Details →
                            </a>

                            ${
                                claim.status === "pending"
                                ? `
                                    <div class="claim-actions">
                                        <button class="approve-btn"
                                            onclick="updateClaim('${escapeHTML(claim._id)}', 'approved')">
                                            ✓ Approve
                                        </button>

                                        <button class="reject-btn"
                                            onclick="updateClaim('${escapeHTML(claim._id)}', 'rejected')">
                                            ✕ Reject
                                        </button>
                                    </div>
                                `
                                : ""
                            }
                        </div>
                    </article>
                `;
            }).join("");
        }

        async function loadClaims() {
            const container = document.getElementById("claimsContainer");

            try {
                const response = await fetch(`${API}/received`, {
                    headers: {
                        Authorization: `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Could not load received claims.");
                }

                claims = Array.isArray(data) ? data : [];

                updateStats();
                displayClaims();

            } catch (error) {
                container.innerHTML = `
                    <div class="empty-claims">
                        <h2>⚠️ Unable to load claims</h2>
                        <p>${escapeHTML(error.message)}</p>
                    </div>
                `;
            }
        }

        async function updateClaim(claimId, newStatus) {
            const action = newStatus === "approved" ? "approve" : "reject";

            if (!confirm(`Are you sure you want to ${action} this claim?`)) {
                return;
            }

            try {
                const response = await fetch(`${API}/${encodeURIComponent(claimId)}/status`, {
                    method: "PATCH",
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: `Bearer ${token}`
                    },
                    body: JSON.stringify({ status: newStatus })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || `Could not ${action} claim.`);
                }

                alert(`Claim ${action}d successfully!`);

                await loadClaims();
                await loadNotificationCount();

            } catch (error) {
                alert(error.message);
            }
        }

        document.getElementById("searchInput").addEventListener("input", displayClaims);
        document.getElementById("statusFilter").addEventListener("change", displayClaims);

        if (token) {
            loadClaims();
            loadNotificationCount();
        }
    </script>

</body>
</html>
