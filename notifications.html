
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications | CampusFind</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f4f6fb;
    color: #172033;
    min-height: 100vh;
}

.navbar {
    background: #fff;
    padding: 17px 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    box-shadow: 0 4px 20px rgba(0,0,0,.05);
}

.logo {
    font-size: 23px;
    font-weight: 800;
    color: #4f46e5;
}

.nav-links {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 17px;
}

.nav-links a {
    text-decoration: none;
    color: #475569;
    font-weight: 600;
    font-size: 14px;
}

.nav-links a:hover {
    color: #4f46e5;
}

.nav-links a.active {
    color: #4f46e5;
}

#logoutBtn {
    border: none;
    background: #ef4444;
    color: white;
    padding: 9px 16px;
    border-radius: 9px;
    font-weight: 600;
    cursor: pointer;
}

.hero {
    background: linear-gradient(120deg, #4f46e5, #7c3aed, #9333ea);
    padding: 55px 20px;
    color: white;
    text-align: center;
}

.hero h1 {
    font-size: 38px;
    margin-bottom: 12px;
}

.hero p {
    opacity: .9;
    font-size: 16px;
}

.container {
    max-width: 1100px;
    margin: 35px auto;
    padding: 0 20px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 28px;
}

.stat-card {
    background: white;
    border-radius: 18px;
    padding: 24px;
    box-shadow: 0 6px 25px rgba(15,23,42,.05);
}

.stat-card h3 {
    font-size: 14px;
    color: #64748b;
    margin-bottom: 12px;
}

.stat-card p {
    font-size: 30px;
    font-weight: 800;
}

.stat-card.total p {
    color: #4f46e5;
}

.stat-card.unread p {
    color: #f59e0b;
}

.stat-card.read p {
    color: #16a34a;
}

.toolbar {
    background: white;
    padding: 22px;
    border-radius: 18px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 22px;
    box-shadow: 0 6px 25px rgba(15,23,42,.05);
}

.filters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.filters button,
.action-btn {
    border: none;
    padding: 10px 15px;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    transition: .2s;
}

.filters button {
    background: #f1f5f9;
    color: #475569;
}

.filters button.active {
    background: #4f46e5;
    color: white;
}

.action-btn {
    background: #16a34a;
    color: white;
}

.action-btn:hover {
    transform: translateY(-2px);
}

.notifications-list {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.notification {
    background: white;
    padding: 22px;
    border-radius: 18px;
    display: flex;
    align-items: flex-start;
    gap: 18px;
    box-shadow: 0 6px 25px rgba(15,23,42,.05);
    border: 1px solid #e8edf5;
    transition: .2s;
}

.notification:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(15,23,42,.08);
}

.notification.unread {
    background: #f8faff;
    border-left: 5px solid #4f46e5;
}

.icon-box {
    width: 50px;
    height: 50px;
    min-width: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 15px;
    font-size: 23px;
    background: #eef2ff;
}

.notification-content {
    flex: 1;
    min-width: 0;
}

.notification-content h3 {
    font-size: 16px;
    margin-bottom: 8px;
}

.notification-content p {
    color: #64748b;
    line-height: 1.6;
    margin-bottom: 10px;
}

.notification-content small {
    color: #94a3b8;
}

.notification-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
}

.notification-actions button,
.notification-actions a {
    border: none;
    text-decoration: none;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
}

.view-btn {
    background: #eef2ff;
    color: #4f46e5;
}

.read-btn {
    background: #ecfdf5;
    color: #15803d;
}

.delete-btn {
    background: #fef2f2;
    color: #dc2626;
}

.empty-state {
    background: white;
    padding: 60px 25px;
    text-align: center;
    border-radius: 20px;
    box-shadow: 0 6px 25px rgba(15,23,42,.05);
}

.empty-state .emoji {
    font-size: 55px;
    margin-bottom: 20px;
}

.empty-state h2 {
    margin-bottom: 10px;
}

.empty-state p {
    color: #64748b;
}

footer {
    text-align: center;
    padding: 25px;
    color: #94a3b8;
}

@media(max-width: 700px) {
    .stats {
        grid-template-columns: 1fr;
    }

    .hero h1 {
        font-size: 29px;
    }

    .notification {
        padding: 16px;
    }

    .navbar {
        justify-content: center;
    }

    .toolbar {
        justify-content: center;
    }
}
</style>
</head>

<body>

<nav class="navbar">
    <div class="logo">🔎 CampusFind</div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="items.html">Browse</a>
        <a href="report-lost.html">Report Lost</a>
        <a href="report-found.html">Report Found</a>
        <a href="my-reports.html">My Reports</a>
        <a href="my-claims.html">My Claims</a>
        <a href="received-claims.html">Received Claims</a>
        <a href="notifications.html" class="active">🔔 Notifications</a>
        <a href="login.html" id="loginLink">Login</a>
        <span id="welcomeUser" style="font-weight:600;color:#4f46e5;"></span>
        <button id="logoutBtn" style="display:none;">Logout</button>
    </div>
</nav>

<section class="hero">
    <h1>🔔 Your Notifications</h1>
    <p>Stay updated on claims, approvals and recovered items.</p>
</section>

<div class="container">

    <div class="stats">
        <div class="stat-card total">
            <h3>Total Notifications</h3>
            <p id="totalCount">0</p>
        </div>

        <div class="stat-card unread">
            <h3>Unread</h3>
            <p id="unreadCount">0</p>
        </div>

        <div class="stat-card read">
            <h3>Read</h3>
            <p id="readCount">0</p>
        </div>
    </div>

    <div class="toolbar">
        <div class="filters">
            <button class="active" data-filter="all">All</button>
            <button data-filter="unread">Unread</button>
            <button data-filter="read">Read</button>
        </div>

        <button class="action-btn" id="markAllRead">
            ✓ Mark All as Read
        </button>
    </div>

    <div id="notificationsList" class="notifications-list"></div>

</div>

<footer>
    © 2026 CampusFind | Campus Lost & Found Platform
</footer>

<script>
const API = "https://campusfind-cl7z.onrender.com/api/notifications";

const token = localStorage.getItem("token");

let user = null;

try {
    user = JSON.parse(localStorage.getItem("user") || "null");
} catch {
    user = null;
}

const list = document.getElementById("notificationsList");

let notifications = [];
let currentFilter = "all";

const loginLink = document.getElementById("loginLink");
const welcomeUser = document.getElementById("welcomeUser");
const logoutBtn = document.getElementById("logoutBtn");

if (!token || !user) {
    alert("Please login to view notifications.");
    window.location.href = "login.html";
} else {
    loginLink.style.display = "none";
    welcomeUser.textContent = "Welcome, " + user.name;
    logoutBtn.style.display = "inline-block";
}

logoutBtn.addEventListener("click", () => {
    localStorage.removeItem("token");
    localStorage.removeItem("user");
    window.location.href = "login.html";
});

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function getIcon(type) {
    const icons = {
        claim_received: "📩",
        claim_approved: "🎉",
        claim_rejected: "❌",
        item_recovered: "✨"
    };

    return icons[type] || "🔔";
}

function getTitle(type) {
    const titles = {
        claim_received: "New Claim Received",
        claim_approved: "Claim Approved",
        claim_rejected: "Claim Rejected",
        item_recovered: "Item Recovered"
    };

    return titles[type] || "Notification";
}

function formatDate(date) {
    if (!date) return "Date unavailable";

    const parsedDate = new Date(date);

    if (isNaN(parsedDate.getTime())) {
        return "Date unavailable";
    }

    return parsedDate.toLocaleString("en-IN");
}

async function loadNotifications() {
    if (!token || !user) return;

    try {
        const response = await fetch(API, {
            headers: {
                Authorization: "Bearer " + token
            }
        });

        if (!response.ok) {
            if (response.status === 401) {
                localStorage.removeItem("token");
                localStorage.removeItem("user");
                alert("Your session has expired. Please login again.");
                window.location.href = "login.html";
                return;
            }

            throw new Error("Unable to load notifications");
        }

        const data = await response.json();

        notifications = Array.isArray(data) ? data : [];

        updateStats();
        renderNotifications();

    } catch (error) {
        list.innerHTML = `
            <div class="empty-state">
                <div class="emoji">⚠️</div>
                <h2>Unable to load notifications</h2>
                <p>${escapeHTML(error.message)}</p>
            </div>
        `;
    }
}

function updateStats() {
    const total = notifications.length;
    const unread = notifications.filter(n => !n.read).length;
    const read = total - unread;

    document.getElementById("totalCount").textContent = total;
    document.getElementById("unreadCount").textContent = unread;
    document.getElementById("readCount").textContent = read;
}

function renderNotifications() {
    let filtered = notifications;

    if (currentFilter === "unread") {
        filtered = notifications.filter(n => !n.read);
    }

    if (currentFilter === "read") {
        filtered = notifications.filter(n => n.read);
    }

    if (!filtered.length) {
        list.innerHTML = `
            <div class="empty-state">
                <div class="emoji">🔔</div>
                <h2>No notifications here</h2>
                <p>You're all caught up!</p>
            </div>
        `;
        return;
    }

    list.innerHTML = filtered.map(n => {
        const itemId = n.relatedItem?._id || "";

        const safeId = escapeHTML(n._id);
        const safeItemId = encodeURIComponent(itemId);
        const safeMessage = escapeHTML(n.message);
        const safeDate = escapeHTML(formatDate(n.createdAt));
        const safeTitle = escapeHTML(getTitle(n.type));
        const safeIcon = getIcon(n.type);

        return `
            <div class="notification ${n.read ? "read" : "unread"}">
                <div class="icon-box">${safeIcon}</div>

                <div class="notification-content">
                    <h3>${safeTitle}</h3>
                    <p>${safeMessage}</p>
                    <small>${safeDate}</small>

                    <div class="notification-actions">
                        ${itemId ? `
                            <a class="view-btn"
                               href="item-details.html?id=${safeItemId}">
                                View Item
                            </a>
                        ` : ""}

                        ${!n.read ? `
                            <button class="read-btn"
                                onclick="markRead('${safeId}')">
                                Mark as Read
                            </button>
                        ` : ""}

                        <button class="delete-btn"
                            onclick="deleteNotification('${safeId}')">
                            Delete
                        </button>
                    </div>
                </div>
            </div>
        `;
    }).join("");
}

async function markRead(id) {
    try {
        const response = await fetch(`${API}/${encodeURIComponent(id)}/read`, {
            method: "PATCH",
            headers: {
                Authorization: "Bearer " + token
            }
        });

        if (!response.ok) {
            throw new Error("Failed to mark notification as read");
        }

        await loadNotifications();

    } catch (error) {
        alert(error.message);
    }
}

document.getElementById("markAllRead").addEventListener("click", async () => {
    try {
        const response = await fetch(`${API}/read-all`, {
            method: "PATCH",
            headers: {
                Authorization: "Bearer " + token
            }
        });

        if (!response.ok) {
            throw new Error("Failed to update notifications");
        }

        await loadNotifications();

    } catch (error) {
        alert(error.message);
    }
});

async function deleteNotification(id) {
    if (!confirm("Delete this notification?")) {
        return;
    }

    try {
        const response = await fetch(`${API}/${encodeURIComponent(id)}`, {
            method: "DELETE",
            headers: {
                Authorization: "Bearer " + token
            }
        });

        if (!response.ok) {
            throw new Error("Failed to delete notification");
        }

        await loadNotifications();

    } catch (error) {
        alert(error.message);
    }
}

document.querySelectorAll(".filters button").forEach(button => {
    button.addEventListener("click", () => {
        document.querySelectorAll(".filters button").forEach(btn => {
            btn.classList.remove("active");
        });

        button.classList.add("active");
        currentFilter = button.dataset.filter;
        renderNotifications();
    });
});

if (token && user) {
    loadNotifications();
}
</script>

</body>
</html>
